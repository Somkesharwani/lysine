openapi: 3.0.0
info:
  title: Lysine API
  version: v1.0

paths:
  /reimbursements:
    get:
      tags:
        - Reimbursement
      summary: Get reimbursement
      operationId: getReimbursement
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReimbursementDto'
    post:
      tags:
        - Reimbursement

      summary: Submit reimbursement request with attached docs and label

      operationId: submitReimbursement

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reimbursement
              properties:
                reimbursement:
                  $ref: '#/components/schemas/ReimbursementDto'

      responses:
        '200':
          description: Reimbursement submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementResponseDto'

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /approve:
    get:
      tags:
        - Reimbursement
      summary: Get reimbursement for approver
      operationId: getReimbursementForApprover
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementResponseDto'
  /approval-workflow/:
    get:
        tags:
            - Reimbursement
        summary: Get reimbursement for approver
        operationId: getWorkflowForApprover
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkflowDto'
        responses:
            '200':
                description: success
                content:
                  application/json:
                      schema:
                        $ref: '#/components/schemas/WorkflowDto'
    post:
      tags:
        - Reimbursement
      summary: submit reimbursement request with attached docs and label
      operationId: approvalWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDto'
      responses:
        '200':
          description: Workflow processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDto'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /_force-model-generation:
    get:
      tags:
        - Internal
      summary: Force model generation
      operationId: forceModelGeneration
      responses:
        '200':
          description: force models
          content:
            application/json:
              schema:
                type: object
                properties:
                  doc:
                    $ref: '#/components/schemas/ReimbursementDocumentDto'
                  type:
                    $ref: '#/components/schemas/ReimbursementType'


components:
  schemas:
    Status:
      type: string
      enum:
        - PENDING
        - APPROVED
        - CLOSED
        - REJECTED
        - SUBMIT
        - PROCESSING
        - CANCEL
        - DELETED

    ReimbursementType:
      type: string
      enum:
        - REGULAR
        - SALE
        - MATERIAL
        - LOGISTICS
        - MISCELLANEOUS

    ReimbursementDocumentDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        filePath:
          type: string
        reimbursementId:
          type: string

    ReimbursementDto:
      type: object
      properties:
        id:
          type: string

        userId:
          type: string

        companyId:
          type: string

        status:
          $ref: '#/components/schemas/Status'

        reimbursementType:
          $ref: '#/components/schemas/ReimbursementType'

        amount:
          type: number
          format: decimal
          example: 1250.75

        expenseDate:
          type: string
          format: date
          example: 2026-04-15

        description:
          type: string

        submittedAt:
          type: string
          format: date-time
          example: 2026-04-15T10:30:00

        approvedBy:
          type: string

        approvedAt:
          type: string
          format: date-time

        rejectionReason:
          type: string

        workflowId:
          type: string

        documents:
          type: array
          items:
            $ref: '#/components/schemas/ReimbursementDocumentDto'

    ReimbursementResponseDto:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Files uploaded successfully"
        status:
          $ref: '#/components/schemas/Status'

    ApproveDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string

    WorkflowDto:
      type: object
      properties:
        reimbursementType:
          $ref: '#/components/schemas/ReimbursementType'
        companyId:
          type: string
        minAmount:
          type: number
          format: decimal
        maxAmount:
          type: number
          format: decimal
        isActive:
          type: boolean
        id:
          type: string
        name:
          type: string
    GetWorkflowDto:
      type: object
      properties:
        reimbursementType:
          $ref: '#/components/schemas/ReimbursementType'
        companyId:
          type: string
        amount:
          type: number
          format: decimal

    ErrorDto:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Validation failed"